<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO — Chemin de fer collaboratif</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#15253a;--muted:#68778b;--bg:#f4f7fb;--line:#dce5ef;--blue:#1769aa;--white:#fff;--shadow:0 8px 25px rgba(30,55,90,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px;font-weight:800}.btn{background:#eaf1f8;color:#214b71}.primary{background:var(--blue);color:#fff}.danger{background:#fff0f0;color:#a12a2a}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brand{font-size:22px;font-weight:950;color:var(--blue)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.grow{flex:1}
main{max-width:1600px;margin:auto;padding:20px}.hidden{display:none!important}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{background:#fff;border:1px solid var(--line)}.tab.on{background:var(--ink);color:#fff}
.panel{display:none}.panel.on{display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:9px;padding:10px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px}.page{background:#fff;border:1px solid var(--line);border-top:7px solid var(--rubric,#789);border-radius:13px;padding:11px;min-height:190px;box-shadow:var(--shadow);position:relative}.page.drag{opacity:.35}.page.over{outline:3px dashed #76a7cf}.pnum{font-size:23px;font-weight:950}.rubric{font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--rubric)}.subject{font-weight:850;line-height:1.25;margin-top:6px;min-height:48px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.badge{display:inline-block;background:#edf3f8;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900}.edit{position:absolute;right:7px;top:7px;padding:5px 7px;background:#f1f5f9}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.col{background:#eaf0f6;border-radius:13px;padding:11px;min-height:430px}.idea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.idea b{display:block}.idea small{color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:90px}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
#login{max-width:440px;margin:10vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:var(--shadow)}#login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.notice{padding:10px;border-radius:9px;background:#eef7ff;color:#24537a;font-size:13px}.presence{font-size:12px;color:var(--muted)}.filebox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc}.dropzone{border:2px dashed #9fb6ca;border-radius:10px;padding:18px;text-align:center;background:#fff;transition:.15s;cursor:pointer;min-height:88px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.dropzone.over{border-color:var(--blue);background:#eef7ff}.dropzone b{color:var(--blue)}.dropzone small{color:var(--muted)}.dropzone input{display:none}.checkline{display:flex!important;align-items:center;gap:9px;color:var(--ink)!important;font-size:13px!important}.checkline input{width:auto!important;margin:0}.filelist{margin-top:10px}.fileitem{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12px}.mini{padding:4px 7px;font-size:11px}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.cols,.grid2{grid-template-columns:1fr}}
@media print{header,.tabs,.toolbar,.stats,.edit{display:none!important}body{background:#fff}main{padding:0;max-width:none}.rail{grid-template-columns:repeat(6,1fr);gap:4px}.page{min-height:140px;box-shadow:none;padding:7px}.pnum{font-size:17px}.subject{font-size:10px}.meta{font-size:8px}}
</style></head><body>
<div id="login">
 <div class="brand">SO <small>Chemin de fer collaboratif</small></div>
 <h2>Connexion équipe</h2><p>Entre ton adresse e-mail : tu recevras un lien de connexion.</p>
 <input id="email" type="email" placeholder="prenom.nom@...">
 <button class="primary" style="width:100%" onclick="magicLink()">Recevoir mon lien</button>
 <p id="loginMsg" class="notice hidden"></p>
</div>

<div id="app" class="hidden">
<header>
 <div class="brand">SO <small>Chemin de fer collaboratif</small></div>
 <select id="issueSelect"></select><button class="btn" onclick="newIssue()">+ Numéro</button><button class="btn" onclick="cloneIssue()">Dupliquer structure</button>
 <span class="grow"></span><span id="presence" class="presence"></span><button class="btn" onclick="window.print()">PDF</button><button class="btn" onclick="logout()">Déconnexion</button>
</header>
<main>
 <div class="tabs"><button class="tab on" data-tab="railP">Chemin de fer</button><button class="tab" data-tab="ideasP">Idées & arbitrages</button><button class="tab" data-tab="searchP">Archives</button></div>
 <section id="railP" class="panel on"><div id="stats" class="stats"></div><div class="toolbar"><input id="filter" class="search" placeholder="Rechercher…"><button class="primary" onclick="addPage()">+ Page</button></div><div id="rail" class="rail"></div></section>
 <section id="ideasP" class="panel"><div class="toolbar"><button class="primary" onclick="addIdea('arbitrer')">+ Proposition</button></div><div class="cols"><div class="col" data-col="arbitrer"><h3>🗳 À arbitrer</h3><div id="arbitrer"></div></div><div class="col" data-col="garder"><h3>💡 Idées à garder</h3><div id="garder"></div></div><div class="col" data-col="reporter"><h3>⏭ Sujets reportés</h3><div id="reporter"></div></div></div></section>
 <section id="searchP" class="panel"><input id="archiveSearch" class="search" style="width:100%" placeholder="Rechercher dans tous les numéros…"><div id="results"></div></section>
</main></div>

<div id="modal" class="modal"><div class="dialog"><h2 id="mtitle"></h2><div id="mbody"></div><div class="foot"><button id="del" class="danger">Supprimer</button><div><button class="btn" onclick="closeM()">Annuler</button> <button id="save" class="primary">Enregistrer</button></div></div></div></div>

<script src="config.js"></script>
<script>
const CFG=window.SO_CONFIG||{};
const COLORS={"Autopub":"#64748b","Rentrée des classes":"#f59e0b","L’instant SO":"#0ea5e9","Le mot du maire":"#2563eb","Courrier des lecteurs":"#8b5cf6","Événement":"#ef4444","Actualités":"#14b8a6","Ça avance":"#f97316","À votre service":"#06b6d4","Aînés-seniors":"#a855f7","Dossier":"#e11d48","Patrimoine":"#92400e","SO Local":"#16a34a","J’aime SO":"#db2777","SO fier":"#7c3aed","Culture":"#dc2626","Sport":"#15803d","Tribunes":"#475569","Service public":"#0369a1","À votre écoute":"#9333ea","Cinéma":"#334155"};
const STATUS=["À attribuer","En recherche d’infos","En cours d’écriture","En attente de photo","En relecture service","En relecture Pierre","Maquetté","Terminé"];
let sb=null,user=null,issues=[],pages=[],ideas=[],teamMembers=[],current=null;
const FILE_BUCKET="page-files";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function init(){
 if(!CFG.url||!CFG.key){document.getElementById("login").innerHTML='<h2>Configuration nécessaire</h2><p>Renseigne <b>config.js</b> avec l’URL du projet et la clé publishable Supabase.</p>';return}
 sb=supabase.createClient(CFG.url,CFG.key);
 const {data:{session}}=await sb.auth.getSession(); if(session){user=session.user;await enter()}
 sb.auth.onAuthStateChange(async(e,s)=>{if(s&&!user){user=s.user;await enter()}});
}
async function magicLink(){let em=email.value.trim();if(!em)return;let {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});loginMsg.classList.remove("hidden");loginMsg.textContent=error?error.message:"Lien envoyé. Ouvre-le depuis ta messagerie."}
async function logout(){await sb.auth.signOut();location.reload()}
async function enter(){login.classList.add("hidden");app.classList.remove("hidden");presence.textContent=user.email;await loadAll();subscribe()}
async function loadAll(){
 let a=await sb.from("magazines").select("*").order("year").order("number");issues=a.data||[];
 if(!issues.length){await seed();a=await sb.from("magazines").select("*").order("year").order("number");issues=a.data||[]}
 current=current||issues.at(-1)?.id; await loadIssue(); let c=await sb.from("ideas").select("*").order("created_at");ideas=c.data||[];let tm=await sb.from("team_members").select("*").order("display_name");teamMembers=tm.data||[];render()
}
async function loadIssue(){if(!current)return;let r=await sb.from("pages").select("*").eq("magazine_id",current).order("position");pages=r.data||[]}
function subscribe(){sb.channel("so-live").on("postgres_changes",{event:"*",schema:"public",table:"pages"},async()=>{await loadIssue();renderRail()}).on("postgres_changes",{event:"*",schema:"public",table:"ideas"},async()=>{let r=await sb.from("ideas").select("*").order("created_at");ideas=r.data||[];renderIdeas()}).on("postgres_changes",{event:"*",schema:"public",table:"magazines"},async()=>{let r=await sb.from("magazines").select("*").order("year").order("number");issues=r.data||[];renderSelect()}).subscribe()}
async function seed(){
 let {data:m}=await sb.from("magazines").insert({number:48,month:"Septembre",year:2026}).select().single();
 const raw=[["Rentrée des classes","Rentrée des classes"],["L’instant SO","L’instant SO"],["Le mot du maire","Le mot du maire"],["Courrier des lecteurs","Courrier des lecteurs"],["Événement","Retour Feu d’artifice et Été audonien"],["Actualités","Forum des sports et des associations + brèves commémorations"],["Actualités","Chaudon rénové !"],["Actualités","Convention LGBTQ+"],["Actualités","Université féministe"],["Actualités","Fonds de solidarité + brèves"],["Actualités","Assises de l’alimentation"],["Actualités","Commerce : arrêté municipal + 3Q à Florent Sevin"],["Actualités","Proximité : bilan des deux mois d’été"],["Ça avance","Carte des travaux en cours"],["Aînés-seniors","Retour Été audonien + programme des activités"],["À votre service","Régie de quartier"],["À votre service","Régie de quartier"],["Dossier","Photo ouverture"],["Dossier","Lead — Rentrée des classes"],["Dossier","Travaux dans les écoles"],["Dossier","Reportage rentrée"],["Dossier","Les nouveautés de la rentrée"],["Dossier","Grande Nef — Je protège nos enfants (5 sept.)"],["Patrimoine","L’hippodrome + encart JEP"],["SO Local","Boulangerie Agathe Boudet + brèves"],["J’aime SO","Maison Nicolas + brèves"],["J’aime SO","Beyrouth sur Seine + brèves"],["SO fier","Baya Belal"],["SO fier","Baya Belal"],["Culture","Salon Ob’art + SOSS + brèves"],["Sport","SO Run 2026"],["Tribunes","Tribunes"],["Service public","État civil + ours"],["À votre écoute","À votre écoute"],["À votre écoute","À votre écoute"]];
 await sb.from("pages").insert(raw.map((x,i)=>({magazine_id:m.id,page_number:i+1,position:i+1,rubric:x[0],subject:x[1],status:"En cours d’écriture"})));current=m.id
}
function render(){renderSelect();renderRail();renderIdeas();searchArchive()}
function renderSelect(){issueSelect.innerHTML=issues.map(i=>`<option value="${i.id}" ${i.id===current?"selected":""}>SO Mag ${i.number} — ${esc(i.month)} ${i.year}</option>`).join("")}
function renderRail(){
 let q=filter.value.toLowerCase(),arr=pages.filter(p=>[p.page_number,p.rubric,p.subject,p.owner,p.elected_official,p.status].join(" ").toLowerCase().includes(q));
 rail.innerHTML=arr.map(p=>`<article class="page" draggable="true" data-id="${p.id}" style="--rubric:${COLORS[p.rubric]||"#789"}"><button class="edit" onclick="editPage('${p.id}')">✎</button><div class="pnum">p. ${p.page_number}</div><div class="rubric">${esc(p.rubric)}</div><div class="subject">${esc(p.subject)||"Page vide"}</div><div class="meta">${p.owner?"✍ "+esc(p.owner)+"<br>":""}${p.char_count?"⌨ "+p.char_count+" signes<br>":""}${p.elected_official?"🏛 "+esc(p.elected_official)+"<br>":""}<span class="badge">${esc(p.status)}</span>${p.double_page?" · double page":""}</div></article>`).join("");
 let todo=pages.filter(p=>p.status==="À attribuer").length,writing=pages.filter(p=>p.status==="En cours d’écriture").length,photo=pages.filter(p=>p.status==="En attente de photo").length,review=pages.filter(p=>["En relecture service","En relecture Pierre"].includes(p.status)).length,done=pages.filter(p=>p.status==="Terminé").length;
 stats.innerHTML=[[todo,"à attribuer"],[writing,"en écriture"],[photo,"attente photo"],[review,"en relecture"],[done,"terminées"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");bindDrag()
}
function rubOpts(v){return Object.keys(COLORS).map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}function statOpts(v){return STATUS.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}
function memberOptions(){return teamMembers.map(m=>`<option value="@${esc(m.handle)}">${esc(m.display_name)} — ${esc(m.email)}</option>`).join("")}
function pform(p){return `<div class="grid2"><div class="field"><label>Page</label><input id="pn" type="number" value="${p.page_number||""}"></div><div class="field"><label>Rubrique</label><select id="pr">${rubOpts(p.rubric)}</select></div></div><div class="field"><label>Sujet</label><input id="ps" value="${esc(p.subject)}"></div><div class="grid2"><div class="field"><label>Responsable / rédaction</label><input id="po" placeholder="Nom du rédacteur / pigiste" value="${esc(p.owner)}"></div><div class="field"><label>Calibrage (signes)</label><input id="pc" type="number" placeholder="Ex. 3500" value="${p.char_count||""}"></div></div><div class="grid2"><div class="field"><label>Élu associé</label><input id="pe" placeholder="Nom de l’élu·e" value="${esc(p.elected_official)}"></div><div class="field"><label>Statut</label><select id="pst">${statOpts(p.status)}</select></div></div><div class="field"><label class="checkline"><input id="pd" type="checkbox" ${p.double_page?"checked":""}> <span>Cette page fait partie d’une <b>double page</b></span></label></div><div class="field"><label>Document Word</label><div id="wordDrop" class="dropzone" tabindex="0"><b>📄 Glisser le Word ici</b><small>ou cliquer pour choisir un fichier .doc / .docx</small><input id="wordFile" type="file" accept=".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></div></div><div class="field"><label>Photos</label><div id="photoDrop" class="dropzone" tabindex="0"><b>📷 Glisser les photos ici</b><small>ou cliquer pour choisir une ou plusieurs images</small><input id="photoFiles" type="file" accept="image/*" multiple></div></div><div class="field"><label>Fichiers déjà joints</label><div class="filebox"><div id="pageFiles" class="filelist">Chargement des fichiers…</div></div></div><div class="field"><label>Notes / commentaires — utilise @prenom pour notifier</label><textarea id="pnotes" list="members" placeholder="Ex. @jerome il manque une photo">${esc(p.notes)}</textarea><datalist id="members">${memberOptions()}</datalist><small>Mentions disponibles : ${teamMembers.map(m=>'@'+esc(m.handle)).join(', ')||'à compléter dans team_members'}</small></div>`}
function extractMentions(t){return [...new Set((t.match(/@([a-zA-Z0-9._-]+)/g)||[]).map(x=>x.slice(1).toLowerCase()))]}
async function notifyNewMentions(page,oldNotes,newNotes){let old=new Set(extractMentions(oldNotes||''));let fresh=extractMentions(newNotes||'').filter(h=>!old.has(h));if(!fresh.length)return;let targets=teamMembers.filter(m=>fresh.includes(String(m.handle||'').toLowerCase()));if(!targets.length)return;let {error}=await sb.functions.invoke('send-mention-email',{body:{page_id:page.id,page_number:page.page_number,subject:ps.value,notes:newNotes,mentions:targets.map(x=>x.handle)}});if(error)console.warn('Notification e-mail non envoyée',error)}
function openM(t,b){mtitle.textContent=t;mbody.innerHTML=b;modal.classList.add("on")}function closeM(){modal.classList.remove("on")}
function setupFileDrops(){
 const setup=(zoneId,inputId,multiple)=>{const z=document.getElementById(zoneId),i=document.getElementById(inputId);if(!z||!i)return;z.onclick=()=>i.click();z.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();i.click()}};["dragenter","dragover"].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();z.classList.add("over")}));["dragleave","drop"].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();z.classList.remove("over")}));z.addEventListener("drop",e=>{const files=[...e.dataTransfer.files];if(!files.length)return;const dt=new DataTransfer();(multiple?files:files.slice(0,1)).forEach(f=>dt.items.add(f));i.files=dt.files;z.querySelector("small").textContent=multiple?`${dt.files.length} photo(s) prête(s) à envoyer`:dt.files[0].name});i.onchange=()=>{if(i.files.length)z.querySelector("small").textContent=multiple?`${i.files.length} photo(s) prête(s) à envoyer`:i.files[0].name}};setup("wordDrop","wordFile",false);setup("photoDrop","photoFiles",true);
}
const LINKED_DOUBLE_RUBRICS=new Set(["so fier","dîner en ville","diner en ville","à votre service","a votre service"]);
function normRubric(v){return String(v||"").trim().toLowerCase()}
function linkedDoublePages(page,rubric){let r=normRubric(rubric||page.rubric);if(!LINKED_DOUBLE_RUBRICS.has(r))return [page];return pages.filter(x=>normRubric(x.rubric)===r).sort((a,b)=>(a.position||a.page_number)-(b.position||b.page_number)).filter(x=>Math.abs((x.page_number||0)-(page.page_number||0))<=1||x.id===page.id).slice(0,2)}
async function editPage(id){let p=pages.find(x=>x.id===id);openM("Modifier la page",pform(p));setupFileDrops();await renderPageFiles(id);save.onclick=async()=>{save.disabled=true;save.textContent="Enregistrement…";let newNotes=pnotes.value;let isLinked=LINKED_DOUBLE_RUBRICS.has(normRubric(pr.value));let payload={page_number:+pn.value,rubric:pr.value,subject:ps.value,owner:po.value,char_count:pc.value?+pc.value:null,elected_official:pe.value,status:pst.value,double_page:isLinked?true:pd.checked,notes:newNotes,updated_by:user.email};let {error}=await sb.from("pages").update(payload).eq("id",id);if(!error&&isLinked){let mates=linkedDoublePages(p,pr.value).filter(x=>x.id!==id);for(const mate of mates){let r=await sb.from("pages").update({subject:ps.value,status:pst.value,double_page:true,updated_by:user.email}).eq("id",mate.id);if(r.error){error=r.error;break}}}if(!error){if(wordFile.files[0])await uploadPageFile(id,wordFile.files[0],"word");for(const f of photoFiles.files)await uploadPageFile(id,f,"photo");await notifyNewMentions(p,p.notes,newNotes)}save.disabled=false;save.textContent="Enregistrer";if(error){alert(error.message);return}closeM();await loadIssue();renderRail()};del.onclick=async()=>{if(confirm("Supprimer cette page ?")){await deleteAllPageFiles(id);await sb.from("pages").delete().eq("id",id);closeM();await loadIssue();renderRail()}}}
async function renderPageFiles(pageId){let box=document.getElementById("pageFiles");if(!box)return;let {data,error}=await sb.from("page_files").select("*").eq("page_id",pageId).order("created_at");if(error){box.innerHTML='<small>Active d’abord la migration fichiers dans Supabase.</small>';return}if(!data?.length){box.innerHTML='<small>Aucun fichier joint pour le moment.</small>';return}box.innerHTML=data.map(f=>`<div class="fileitem"><span>${f.kind==="photo"?"📷":"📄"} ${esc(f.file_name)}</span><span><button type="button" class="btn mini" onclick="openPageFile('${f.id}')">Ouvrir</button> <button type="button" class="danger mini" onclick="removePageFile('${f.id}','${pageId}')">×</button></span></div>`).join("")}
async function uploadPageFile(pageId,file,kind){if(kind==="word"){let old=await sb.from("page_files").select("*").eq("page_id",pageId).eq("kind","word");for(const f of old.data||[])await removePageFile(f.id,pageId,false)}let safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");let path=`${pageId}/${Date.now()}-${safe}`;let up=await sb.storage.from(FILE_BUCKET).upload(path,file,{upsert:false});if(up.error){alert("Envoi impossible : "+up.error.message);return}let ins=await sb.from("page_files").insert({page_id:pageId,kind,file_name:file.name,storage_path:path,uploaded_by:user.email});if(ins.error)alert(ins.error.message)}
async function openPageFile(fileId){let {data:f}=await sb.from("page_files").select("*").eq("id",fileId).single();if(!f)return;let {data,error}=await sb.storage.from(FILE_BUCKET).createSignedUrl(f.storage_path,3600);if(error){alert(error.message);return}window.open(data.signedUrl,"_blank")}
async function removePageFile(fileId,pageId,refresh=true){let {data:f}=await sb.from("page_files").select("*").eq("id",fileId).single();if(f){await sb.storage.from(FILE_BUCKET).remove([f.storage_path]);await sb.from("page_files").delete().eq("id",fileId)}if(refresh)await renderPageFiles(pageId)}
async function deleteAllPageFiles(pageId){let {data}=await sb.from("page_files").select("*").eq("page_id",pageId);let paths=(data||[]).map(f=>f.storage_path);if(paths.length)await sb.storage.from(FILE_BUCKET).remove(paths);await sb.from("page_files").delete().eq("page_id",pageId)}
async function addPage(){let pos=(Math.max(0,...pages.map(p=>p.position))+1),num=(Math.max(0,...pages.map(p=>p.page_number))+1);let {data}=await sb.from("pages").insert({magazine_id:current,page_number:num,position:pos,rubric:"Actualités",subject:"",status:"En cours d’écriture",updated_by:user.email}).select().single();await loadIssue();editPage(data.id)}
function bindDrag(){let d=null;document.querySelectorAll(".page").forEach(el=>{el.ondragstart=()=>{d=el.dataset.id;el.classList.add("drag")};el.ondragend=()=>el.classList.remove("drag");el.ondragover=e=>{e.preventDefault();el.classList.add("over")};el.ondragleave=()=>el.classList.remove("over");el.ondrop=async e=>{e.preventDefault();el.classList.remove("over");let t=el.dataset.id;if(!d||d===t)return;let arr=[...pages],a=arr.findIndex(x=>x.id===d),b=arr.findIndex(x=>x.id===t),[it]=arr.splice(a,1);arr.splice(b,0,it);await Promise.all(arr.map((p,i)=>sb.from("pages").update({position:i+1}).eq("id",p.id)));await loadIssue();renderRail()}})}
function renderIdeas(){["arbitrer","garder","reporter"].forEach(c=>document.getElementById(c).innerHTML=ideas.filter(i=>i.column_name===c).map(i=>`<div class="idea" draggable="true" data-idea="${i.id}" onclick="editIdea('${i.id}')"><b>${esc(i.title)}</b><small>${esc(i.rubric)}${i.target_issue?" · "+esc(i.target_issue):""}</small></div>`).join(""));document.querySelectorAll(".idea").forEach(x=>x.ondragstart=e=>e.dataTransfer.setData("idea",x.dataset.idea));document.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=async e=>{e.preventDefault();let id=e.dataTransfer.getData("idea");if(id)await sb.from("ideas").update({column_name:c.dataset.col,updated_by:user.email}).eq("id",id)}})}
function iform(i){return `<div class="field"><label>Titre</label><input id="it" value="${esc(i.title)}"></div><div class="grid2"><div class="field"><label>Rubrique</label><select id="ir">${rubOpts(i.rubric)}</select></div><div class="field"><label>Priorité</label><select id="ip">${["Basse","Normale","Haute","Urgente"].map(x=>`<option ${x===i.priority?"selected":""}>${x}</option>`)}</select></div></div><div class="field"><label>Numéro / mois envisagé</label><input id="itg" value="${esc(i.target_issue)}"></div><div class="field"><label>Description / contact / notes</label><textarea id="idesc">${esc(i.description)}</textarea></div>`}
async function addIdea(c){let {data}=await sb.from("ideas").insert({title:"",rubric:"Actualités",priority:"Normale",column_name:c,created_by:user.email,updated_by:user.email}).select().single();ideas.push(data);editIdea(data.id)}
function editIdea(id){let i=ideas.find(x=>x.id===id);openM("Sujet / idée",iform(i));save.onclick=async()=>{await sb.from("ideas").update({title:it.value,rubric:ir.value,priority:ip.value,target_issue:itg.value,description:idesc.value,updated_by:user.email}).eq("id",id);closeM()};del.onclick=async()=>{await sb.from("ideas").delete().eq("id",id);closeM()}}
async function newIssue(){let n=prompt("Numéro ?");if(!n)return;let m=prompt("Mois ?","Octobre"),y=prompt("Année ?","2026");let {data}=await sb.from("magazines").insert({number:+n,month:m,year:+y,created_by:user.email}).select().single();current=data.id;await loadAll()}
async function cloneIssue(){let src=issues.find(x=>x.id===current),n=prompt("Nouveau numéro ?",String(+src.number+1));if(!n)return;let m=prompt("Mois ?","Octobre"),y=prompt("Année ?",String(src.year));let {data:mag}=await sb.from("magazines").insert({number:+n,month:m,year:+y,created_by:user.email}).select().single();await sb.from("pages").insert(pages.map((p,i)=>({magazine_id:mag.id,page_number:p.page_number,position:i+1,rubric:p.rubric,subject:["Tribunes","Service public","À votre écoute"].includes(p.rubric)?p.subject:"",status:"En cours d’écriture",double_page:p.double_page,updated_by:user.email})));current=mag.id;await loadAll()}
async function searchArchive(){let q=(archiveSearch.value||"").trim();if(!q){results.innerHTML="<p>Recherche un sujet dans les anciens numéros.</p>";return}let r=await sb.from("pages").select("*,magazines(number,month,year)").or(`subject.ilike.%${q}%,rubric.ilike.%${q}%,owner.ilike.%${q}%`).limit(100);results.innerHTML=(r.data||[]).map(p=>`<div class="idea"><b>SO Mag ${p.magazines?.number} — p. ${p.page_number} · ${esc(p.rubric)}</b>${esc(p.subject)}<br><small>${esc(p.magazines?.month)} ${p.magazines?.year}</small></div>`).join("")||"<p>Aucun résultat.</p>"}
async function changeIssue(){current=issueSelect.value;await loadIssue();renderRail()}
issueSelect.onchange=changeIssue;filter.oninput=renderRail;archiveSearch.oninput=searchArchive;modal.onclick=e=>{if(e.target===modal)closeM()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.getElementById(t.dataset.tab).classList.add("on")});
init();
</script>
</body></html>
