<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO — Chemin de fer collaboratif</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#15253a;--muted:#68778b;--bg:#f4f7fb;--line:#dce5ef;--blue:#1769aa;--white:#fff;--shadow:0 8px 25px rgba(30,55,90,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px;font-weight:800}.btn{background:#eaf1f8;color:#214b71}.primary{background:var(--blue);color:#fff}.danger{background:#fff0f0;color:#a12a2a}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.brand{font-size:22px;font-weight:950;color:var(--blue)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.grow{flex:1}
main{max-width:1600px;margin:auto;padding:20px}.hidden{display:none!important}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{background:#fff;border:1px solid var(--line)}.tab.on{background:var(--ink);color:#fff}
.panel{display:none}.panel.on{display:block}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:9px;padding:10px}
.rail{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  column-gap:5px;
  row-gap:18px;
}
.page:nth-child(2n+1){
  margin-left:18px;
}.page{background:#fff;border:1px solid var(--line);border-top:7px solid var(--rubric,#789);border-radius:13px;padding:11px;min-height:190px;box-shadow:var(--shadow);position:relative}.page.drag{opacity:.35}.page.over{outline:3px dashed #76a7cf}.pnum{font-size:23px;font-weight:950}.rubric{font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:var(--rubric)}.subject{font-weight:850;line-height:1.25;margin-top:6px;min-height:48px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.badge{display:inline-block;background:#edf3f8;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900}.donecheck{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#16a34a;color:#fff;font-weight:950;font-size:15px}.briefbadge{display:inline-block;background:#fff7ed;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900}.edit{position:absolute;right:7px;top:7px;padding:5px 7px;background:#f1f5f9}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.col{background:#eaf0f6;border-radius:13px;padding:11px;min-height:430px}.idea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.idea b{display:block}.idea small{color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(15,25,40,.5);z-index:50;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.dialog{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:19px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.field textarea{min-height:90px}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
#login{max-width:440px;margin:10vh auto;background:#fff;padding:25px;border-radius:16px;box-shadow:var(--shadow)}#login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin:10px 0}.notice{padding:10px;border-radius:9px;background:#eef7ff;color:#24537a;font-size:13px}.presence{font-size:12px;color:var(--muted)}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.cols,.grid2{grid-template-columns:1fr}}
@media print{header,.tabs,.toolbar,.stats,.edit{display:none!important}body{background:#fff}main{padding:0;max-width:none}.rail{grid-template-columns:repeat(6,1fr);gap:4px}.page{min-height:140px;box-shadow:none;padding:7px}.pnum{font-size:17px}.subject{font-size:10px}.meta{font-size:8px}}
</style></head><body>
<div id="login">
 <div class="brand">SO <small>Chemin de fer collaboratif</small></div>
 <h2>Connexion équipe</h2><p>Connecte-toi avec ton nom d’utilisateur et ton mot de passe.</p>
 <input id="username" autocomplete="username" placeholder="Nom d’utilisateur">
 <input id="password" type="password" autocomplete="current-password" placeholder="Mot de passe">
 <button class="primary" style="width:100%" onclick="appLogin()">Se connecter</button>
 <p id="loginMsg" class="notice hidden"></p>
</div>

<div id="app" class="hidden">
<header>
 <div class="brand">SO <small>Chemin de fer collaboratif · CORRIGÉ 22/09</small></div>
 <select id="issueSelect"></select><button class="btn" onclick="newIssue()">+ Numéro</button><button class="btn" onclick="cloneIssue()">Dupliquer structure</button>
 <span class="grow"></span><button id="bell" class="btn" onclick="showNotifications()">🔔 <b id="bellCount">0</b></button><button id="usersBtn" class="btn hidden" onclick="manageUsers()">Utilisateurs</button><span id="presence" class="presence"></span><button class="btn" onclick="window.print()">PDF</button><button class="btn" onclick="logout()">Déconnexion</button>
</header>
<main>
 <div class="tabs"><button class="tab on" data-tab="railP">Chemin de fer</button><button class="tab" data-tab="ideasP">Idées & arbitrages</button><button class="tab" data-tab="searchP">Archives</button></div>
 <section id="railP" class="panel on"><div id="stats" class="stats"></div><div class="toolbar"><input id="filter" class="search" placeholder="Rechercher…"><button class="primary" onclick="addPage()">+ Page</button></div><div id="rail" class="rail"></div></section>
 <section id="ideasP" class="panel"><div class="toolbar"><button class="primary" onclick="addIdea('arbitrer')">+ Proposition</button></div><div class="cols"><div class="col" data-col="arbitrer"><h3>🗳 À arbitrer</h3><div id="arbitrer"></div></div><div class="col" data-col="garder"><h3>💡 Idées à garder</h3><div id="garder"></div></div><div class="col" data-col="reporter"><h3>⏭ Sujets reportés</h3><div id="reporter"></div></div></div></section>
 <section id="searchP" class="panel"><input id="archiveSearch" class="search" style="width:100%" placeholder="Rechercher dans tous les numéros…"><div id="results"></div></section>
</main></div>

<div id="modal" class="modal"><div class="dialog"><h2 id="mtitle"></h2><div id="mbody"></div><div class="foot"><button id="del" class="danger">Supprimer</button><div><button class="btn" onclick="closeM()">Annuler</button> <button id="save" class="primary">Enregistrer</button></div></div></div></div>

<script src="config.js"></script>
<script>
const CFG=window.SO_CONFIG||{};
const COLORS={"Autopub":"#64748b","La Une":"#0ea5e9","Le mot du maire":"#2563eb", "L’instant SO":"#0ea5e9","Courrier des lecteurs":"#8b5cf6","Événement":"#ef4444","Actualités":"#14b8a6","Ça avance":"#f97316","À votre service":"#06b6d4","Ma vie de quartier":"#10b981","Aînés-seniors":"#a855f7","Dossier":"#e11d48","Patrimoine":"#92400e","SO Local":"#16a34a","J’aime SO":"#db2777","SO fier":"#7c3aed","Culture":"#dc2626","Sport":"#15803d","Ma vie de quartier":"#10b981", "Tribunes":"#475569","Service public":"#0369a1","À votre écoute":"#9333ea","Cinéma":"#334155","Dîner en ville":"#b45309"};
const STATUS=["","A distribuer à un pigiste","En cours d’écriture","En recherche d’infos","En attente de photo","À relire","En relecture service","En relecture Pierre","Relu","En attente de maquettage","Maquetté","Terminé"];
let sb=null,user=null,issues=[],pages=[],ideas=[],pageFiles=[],current=null,appToken=localStorage.getItem("so_app_token")||"",appMe=null,users=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function makeClient(token=""){return supabase.createClient(CFG.url,CFG.key,{global:{headers:token?{"x-app-token":token}:{}}})}
async function init(){
 if(!CFG.url||!CFG.key||CFG.url.includes("VOTRE-PROJET")){document.getElementById("login").innerHTML='<h2>Configuration nécessaire</h2><p>Renseigne <b>config.js</b> avec l’URL et la clé publishable de ton projet Supabase.</p>';return}
 sb=makeClient(appToken); if(appToken){let r=await sb.from("app_users").select("id,username,display_name,role,active").limit(100);if(!r.error){users=r.data||[];appMe=users.find(x=>x.id===localStorage.getItem("so_user_id"));if(appMe&&appMe.active)return enter()}}
 localStorage.removeItem("so_app_token");localStorage.removeItem("so_user_id");appToken="";sb=makeClient();
}
async function appLogin(){let u=username.value.trim(),p=password.value;if(!u||!p)return;let {data,error}=await sb.rpc("app_login",{p_username:u,p_password:p});loginMsg.classList.remove("hidden");if(error){loginMsg.textContent=error.message;return}let x=data?.[0];appToken=x.token;localStorage.setItem("so_app_token",appToken);localStorage.setItem("so_user_id",x.user_id);sb=makeClient(appToken);appMe=x;await enter()}
async function logout(){if(appToken)try{await sb.rpc("app_logout",{p_token:appToken})}catch(e){} localStorage.clear();location.reload()}
async function enter(){login.classList.add("hidden");app.classList.remove("hidden");presence.textContent=appMe.display_name||appMe.username;usersBtn.classList.toggle("hidden",appMe.role!=="admin");await loadUsers();await loadAll();await refreshNotifications();subscribe()}
async function loadUsers(){let r=await sb.from("app_users").select("id,username,display_name,role,active").order("display_name");users=r.data||[]}
async function loadAll(){
 let a=await sb.from("magazines").select("*").order("year").order("number");issues=a.data||[];
 if(!issues.length){await seed();a=await sb.from("magazines").select("*").order("year").order("number");issues=a.data||[]}
 current=current||issues.at(-1)?.id; await loadIssue(); let c=await sb.from("ideas").select("*").order("created_at");ideas=c.data||[];render()
}
async function loadIssue(){if(!current)return;let r=await sb.from("pages").select("*").eq("magazine_id",current).order("position");pages=r.data||[]; pages.sort((a,b)=>{const na=Number(a.page_number)||0,nb=Number(b.page_number)||0;if(na===38&&nb!==38)return -1;if(nb===38&&na!==38)return 1;return na-nb});if(pages.length){let f=await sb.from("page_files").select("id,page_id,kind,file_name,storage_path,uploaded_by,created_at").in("page_id",pages.map(p=>p.id));if(f.error){console.error("Lecture page_files:",f.error);pageFiles=[]}else pageFiles=f.data||[]}else pageFiles=[]}
function subscribe(){sb.channel("so-live").on("postgres_changes",{event:"*",schema:"public",table:"pages"},async()=>{await loadIssue();renderRail()}).on("postgres_changes",{event:"*",schema:"public",table:"ideas"},async()=>{let r=await sb.from("ideas").select("*").order("created_at");ideas=r.data||[];renderIdeas()}).on("postgres_changes",{event:"*",schema:"public",table:"magazines"},async()=>{let r=await sb.from("magazines").select("*").order("year").order("number");issues=r.data||[];renderSelect()}).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:`user_id=eq.${localStorage.getItem("so_user_id")}`},async()=>{beep();await refreshNotifications()}).subscribe()}
async function seed(){
 let {data:m}=await sb.from("magazines").insert({number:48,month:"Septembre",year:2026}).select().single();
 const raw=[["Rentrée des classes","Rentrée des classes"],["L’instant SO","L’instant SO"],["Le mot du maire","Le mot du maire"],["Courrier des lecteurs","Courrier des lecteurs"],["Événement","Retour Feu d’artifice et Été audonien"],["Actualités","Forum des sports et des associations + brèves commémorations"],["Actualités","Chaudon rénové !"],["Actualités","Convention LGBTQ+"],["Actualités","Université féministe"],["Actualités","Fonds de solidarité + brèves"],["Actualités","Assises de l’alimentation"],["Actualités","Commerce : arrêté municipal + 3Q à Florent Sevin"],["Actualités","Proximité : bilan des deux mois d’été"],["Ça avance","Carte des travaux en cours"],["Aînés-seniors","Retour Été audonien + programme des activités"],["À votre service","Régie de quartier"],["À votre service","Régie de quartier"],["Dossier","Photo ouverture"],["Dossier","Lead — Rentrée des classes"],["Dossier","Travaux dans les écoles"],["Dossier","Reportage rentrée"],["Dossier","Les nouveautés de la rentrée"],["Dossier","Grande Nef — Je protège nos enfants (5 sept.)"],["Patrimoine","L’hippodrome + encart JEP"],["SO Local","Boulangerie Agathe Boudet + brèves"],["J’aime SO","Maison Nicolas + brèves"],["J’aime SO","Beyrouth sur Seine + brèves"],["SO fier","Baya Belal"],["SO fier","Baya Belal"],["Culture","Salon Ob’art + SOSS + brèves"],["Sport","SO Run 2026"],["Tribunes","Tribunes"],["Service public","État civil + ours"],["À votre écoute","À votre écoute"],["À votre écoute","À votre écoute"]];
 await sb.from("pages").insert(raw.map((x,i)=>({magazine_id:m.id,page_number:i+1,position:i+1,rubric:x[0],subject:x[1],status:"Idée"})));current=m.id
}
function render(){renderSelect();renderRail();renderIdeas();searchArchive()}
function renderSelect(){issueSelect.innerHTML=issues.map(i=>`<option value="${i.id}" ${i.id===current?"selected":""}>SO Mag ${i.number} — ${esc(i.month)} ${i.year}</option>`).join("")}
function renderRail(){
 let q=filter.value.toLowerCase(),arr=pages.filter(p=>[p.page_number,p.rubric,p.subject,p.owner,p.status].join(" ").toLowerCase().includes(q));
 rail.innerHTML=arr.map(p=>`<article class="page" draggable="true" data-id="${p.id}" style="--rubric:${COLORS[p.rubric]||"#789"}"><button class="edit" onclick="editPage('${p.id}')">✎</button><div class="pnum">p. ${p.page_number}</div><div class="rubric">${esc(p.rubric)}</div><div class="subject">${esc(p.subject)||""}</div><div class="meta">${(p.writer||p.owner)?"✍ "+esc(p.writer||p.owner)+"<br>":""}${p.char_count?"⌨ "+p.char_count+" signes<br>":""}${pageFiles.some(f=>f.page_id===p.id&&f.kind==="photo")?"📷 ":""}${pageFiles.some(f=>f.page_id===p.id&&f.kind==="word")?"📄 ":""}${p.status==="Terminé"?'<span class="donecheck" title="Terminé">✓</span>':(p.status?`<span class="badge">${esc(p.status)}</span>`:"")}${p.brief?' <span class="briefbadge">Brève</span>':""}${p.double_page?" · double page":""}</div></article>`).join("");
 let done=pages.filter(p=>["Maquetté","Terminé"].includes(p.status)).length,review=pages.filter(p=>["En relecture service","En relecture Pierre","À relire"].includes(p.status)).length,photo=pages.filter(p=>p.status==="En attente de photo").length,cmd=pages.filter(p=>p.status==="En attente de maquettage").length,writing=pages.filter(p=>["En recherche d’infos","En cours d’écriture","Relu"].includes(p.status)).length;
 stats.innerHTML=[[cmd,"en attente de maquettage"],[writing,"en cours"],[photo,"attente photo"],[review,"en relecture"],[done,"maquettées"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");bindDrag()
}
function rubOpts(v){return Object.keys(COLORS).map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("")}function statOpts(v){return STATUS.map(x=>`<option value="${x}" ${x===v?"selected":""}>${x||"— Aucun statut —"}</option>`).join("")}
function pform(p){return `<div class="grid2"><div class="field"><label>Page</label><input id="pn" type="number" value="${p.page_number||""}"></div><div class="field"><label>Rubrique</label><select id="pr">${rubOpts(p.rubric)}</select></div></div><div class="field"><label>Sujet</label><input id="ps" value="${esc(p.subject)}"></div><div class="grid2"><div class="field"><label>Qui écrit l’article ?</label><select id="po"><option value="">—</option>${["Pierre","Camille","Tiphaine","Marine","Rose","Hélène","Giovanni","Marion","Clémence"].map(n=>`<option value="${esc(n)}" ${n===(p.writer||p.owner)?"selected":""}>${esc(n)}</option>`).join("")}</select></div><div class="field"><label>Calibrage (signes)</label><input id="pc" type="number" value="${p.char_count||""}"></div></div><div class="grid2"><div class="field"><label>Statut</label><select id="pst">${statOpts(p.status)}</select></div><div class="field"><label><input id="pd" type="checkbox" ${p.double_page?"checked":""}> Double page</label><br><label><input id="pb" type="checkbox" ${p.brief?"checked":""}> Brève</label></div></div><div class="field"><label>Notes</label><textarea id="pnotes">${esc(p.notes)}</textarea></div><div id="fileZone"></div><div id="commentZone"></div>`}
function openM(t,b){mtitle.textContent=t;mbody.innerHTML=b;modal.classList.add("on")}function closeM(){modal.classList.remove("on")}
function editPage(id){let p=pages.find(x=>x.id===id);openM("Modifier la page",pform(p));loadPageExtras(id);save.onclick=async()=>{await sb.from("pages").update({page_number:+pn.value,rubric:pr.value,subject:ps.value,owner:po.value,writer:po.value,char_count:pc.value?+pc.value:null,status:pst.value,double_page:pd.checked,brief:pb.checked,notes:pnotes.value,updated_by:appMe.display_name}).eq("id",id);closeM();await loadIssue();renderRail()};del.onclick=async()=>{if(confirm("Supprimer cette page ?")){await sb.from("pages").delete().eq("id",id);closeM();await loadIssue();renderRail()}}}
async function addPage(){let pos=(Math.max(0,...pages.map(p=>p.position))+1),num=(Math.max(0,...pages.map(p=>p.page_number))+1);let {data}=await sb.from("pages").insert({magazine_id:current,page_number:num,position:pos,rubric:"Actualités",subject:"",status:"",updated_by:appMe.display_name}).select().single();await loadIssue();editPage(data.id)}
function bindDrag(){let d=null;document.querySelectorAll(".page").forEach(el=>{el.ondragstart=()=>{d=el.dataset.id;el.classList.add("drag")};el.ondragend=()=>el.classList.remove("drag");el.ondragover=e=>{e.preventDefault();el.classList.add("over")};el.ondragleave=()=>el.classList.remove("over");el.ondrop=async e=>{e.preventDefault();el.classList.remove("over");let t=el.dataset.id;if(!d||d===t)return;let arr=[...pages],a=arr.findIndex(x=>x.id===d),b=arr.findIndex(x=>x.id===t),[it]=arr.splice(a,1);arr.splice(b,0,it);await Promise.all(arr.map((p,i)=>sb.from("pages").update({position:i+1}).eq("id",p.id)));await loadIssue();renderRail()}})}
function renderIdeas(){["arbitrer","garder","reporter"].forEach(c=>document.getElementById(c).innerHTML=ideas.filter(i=>i.column_name===c).map(i=>`<div class="idea" draggable="true" data-idea="${i.id}" onclick="editIdea('${i.id}')"><b>${esc(i.title)}</b><small>${esc(i.rubric)}${i.target_issue?" · "+esc(i.target_issue):""}</small></div>`).join(""));document.querySelectorAll(".idea").forEach(x=>x.ondragstart=e=>e.dataTransfer.setData("idea",x.dataset.idea));document.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=async e=>{e.preventDefault();let id=e.dataTransfer.getData("idea");if(id)await sb.from("ideas").update({column_name:c.dataset.col,updated_by:appMe.display_name}).eq("id",id)}})}
function iform(i){return `<div class="field"><label>Titre</label><input id="it" value="${esc(i.title)}"></div><div class="grid2"><div class="field"><label>Rubrique</label><select id="ir">${rubOpts(i.rubric)}</select></div><div class="field"><label>Priorité</label><select id="ip">${["Basse","Normale","Haute","Urgente"].map(x=>`<option ${x===i.priority?"selected":""}>${x}</option>`)}</select></div></div><div class="field"><label>Numéro / mois envisagé</label><input id="itg" value="${esc(i.target_issue)}"></div><div class="field"><label>Description / contact / notes</label><textarea id="idesc">${esc(i.description)}</textarea></div>`}
async function addIdea(c){let {data}=await sb.from("ideas").insert({title:"",rubric:"Actualités",priority:"Normale",column_name:c,created_by:appMe.display_name,updated_by:appMe.display_name}).select().single();ideas.push(data);editIdea(data.id)}
function editIdea(id){let i=ideas.find(x=>x.id===id);openM("Sujet / idée",iform(i));save.onclick=async()=>{await sb.from("ideas").update({title:it.value,rubric:ir.value,priority:ip.value,target_issue:itg.value,description:idesc.value,updated_by:appMe.display_name}).eq("id",id);closeM()};del.onclick=async()=>{await sb.from("ideas").delete().eq("id",id);closeM()}}
async function newIssue(){let n=prompt("Numéro ?");if(!n)return;let m=prompt("Mois ?","Octobre"),y=prompt("Année ?","2026");let {data}=await sb.from("magazines").insert({number:+n,month:m,year:+y,created_by:appMe.display_name}).select().single();current=data.id;await loadAll()}
async function cloneIssue(){let src=issues.find(x=>x.id===current),n=prompt("Nouveau numéro ?",String(+src.number+1));if(!n)return;let m=prompt("Mois ?","Octobre"),y=prompt("Année ?",String(src.year));let {data:mag}=await sb.from("magazines").insert({number:+n,month:m,year:+y,created_by:appMe.display_name}).select().single();await sb.from("pages").insert(pages.map((p,i)=>({magazine_id:mag.id,page_number:p.page_number,position:i+1,rubric:p.rubric,subject:["Tribunes","Service public","À votre écoute"].includes(p.rubric)?p.subject:"",status:"",double_page:p.double_page,brief:p.brief||false,updated_by:appMe.display_name})));current=mag.id;await loadAll()}
async function searchArchive(){let q=(archiveSearch.value||"").trim();if(!q){results.innerHTML="<p>Recherche un sujet dans les anciens numéros.</p>";return}let r=await sb.from("pages").select("*,magazines(number,month,year)").or(`subject.ilike.%${q}%,rubric.ilike.%${q}%,owner.ilike.%${q}%`).limit(100);results.innerHTML=(r.data||[]).map(p=>`<div class="idea"><b>SO Mag ${p.magazines?.number} — p. ${p.page_number} · ${esc(p.rubric)}</b>${esc(p.subject)}<br><small>${esc(p.magazines?.month)} ${p.magazines?.year}</small></div>`).join("")||"<p>Aucun résultat.</p>"}
async function changeIssue(){current=issueSelect.value;await loadIssue();renderRail()}
issueSelect.onchange=changeIssue;filter.oninput=renderRail;archiveSearch.oninput=searchArchive;modal.onclick=e=>{if(e.target===modal)closeM()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.getElementById(t.dataset.tab).classList.add("on")});

async function refreshNotifications(){let r=await sb.from("notifications").select("*,app_users!notifications_actor_id_fkey(display_name)").eq("user_id",appMe.id).order("created_at",{ascending:false}).limit(50);window.myNotifs=r.data||[];bellCount.textContent=myNotifs.filter(n=>!n.read_at).length}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);g.gain.value=.06;o.frequency.value=880;o.start();o.stop(a.currentTime+.12)}catch(e){}}
async function showNotifications(){await refreshNotifications();openM("Notifications",`<div>${myNotifs.map(n=>`<div class="idea" onclick="openNotif('${n.id}','${n.page_id||""}')"><b>${n.read_at?"":"● "}${esc(n.app_users?.display_name||"Quelqu’un")}</b>${esc(n.message)}<br><small>${new Date(n.created_at).toLocaleString("fr-FR")}</small></div>`).join("")||"Aucune notification"}</div>`);del.classList.add("hidden");save.classList.add("hidden")}
async function openNotif(id,page){await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("id",id);closeM();await refreshNotifications();if(page)editPage(page)}
async function manageUsers(){await loadUsers();openM("Utilisateurs",`<div class="field"><label>Nom affiché</label><input id="newDisplay"></div><div class="grid2"><div class="field"><label>Identifiant</label><input id="newUsername"></div><div class="field"><label>Mot de passe initial</label><input id="newPassword" type="password"></div></div><div class="field"><label>Rôle</label><select id="newRole"><option value="user">Utilisateur</option><option value="admin">Admin</option></select></div><button class="primary" onclick="createUser()">Créer l’utilisateur</button><hr>${users.map(u=>`<div class="idea"><b>${esc(u.display_name)}</b><small>@${esc(u.username)} · ${u.role} · ${u.active?"actif":"désactivé"}</small> <button class="btn" onclick="resetPw('${u.id}')">Mot de passe</button> <button class="btn" onclick="toggleUser('${u.id}',${!u.active})">${u.active?"Désactiver":"Activer"}</button></div>`).join("")}`);del.classList.add("hidden");save.classList.add("hidden")}
async function createUser(){let {error}=await sb.rpc("app_create_user",{p_username:newUsername.value,p_display_name:newDisplay.value,p_password:newPassword.value,p_role:newRole.value});if(error)return alert(error.message);await manageUsers()}
async function resetPw(id){let p=prompt("Nouveau mot de passe :");if(!p)return;let {error}=await sb.rpc("app_reset_password",{p_user:id,p_password:p});if(error)alert(error.message);else alert("Mot de passe modifié")}
async function toggleUser(id,v){let {error}=await sb.rpc("app_set_user_active",{p_user:id,p_active:v});if(error)alert(error.message);else await manageUsers()}
async function loadPageExtras(pageId){let [f,c]=await Promise.all([sb.from("page_files").select("id,page_id,kind,file_name,storage_path,uploaded_by,created_at").eq("page_id",pageId).order("created_at"),sb.from("page_comments").select("*,app_users!page_comments_author_id_fkey(display_name,username)").eq("page_id",pageId).order("created_at")]);fileZone.innerHTML=`<hr><h3>Fichiers</h3><div class="grid2"><div><label>📄 Word</label><input id="wordUpload" type="file" accept=".doc,.docx"></div><div><label>📷 Photos</label><input id="photoUpload" type="file" accept="image/*" multiple></div></div><button class="btn" id="uploadFilesBtn" type="button">Ajouter les fichiers</button><div>${(f.data||[]).map(x=>`<div class="idea"><b>${x.kind==='word'?'📄':'📷'} ${esc(x.file_name)}</b><button class="btn" onclick="downloadFile('${x.storage_path}','${esc(x.file_name)}')">Télécharger</button> <button class="danger" onclick="deleteFile('${x.id}','${x.storage_path}','${pageId}')">Supprimer</button></div>`).join("")}</div>`;document.getElementById("uploadFilesBtn").onclick=()=>uploadFiles(pageId);commentZone.innerHTML=`<hr><h3>Commentaires & @mentions</h3><div>${(c.data||[]).map(x=>`<div class="idea"><b>${esc(x.app_users?.display_name||"")}</b><div>${esc(x.body)}</div>${x.resolved_at?`<small>✓ Traité</small>`:`<div style="margin-top:7px"><button class="btn" onclick="replyComment('${x.id}','${esc(x.app_users?.username||"")}')">↩ Répondre</button> <button class="btn" onclick="resolveComment('${x.id}','${pageId}')">✓ Marquer comme traité</button></div>`}</div>`).join("")}</div><div class="field"><textarea id="newComment" placeholder="Écris un commentaire, par ex. @Julie peux-tu relire ?"></textarea></div><button class="primary" onclick="postComment('${pageId}')">Envoyer</button>`}
  function replyComment(id,username){let box=document.getElementById("newComment");box.value=username?"@"+username+" ":"";box.focus()}
  async function resolveComment(id,pageId){let myId=localStorage.getItem("so_user_id");let {error}=await sb.from("page_comments").update({resolved_at:new Date().toISOString(),resolved_by:myId}).eq("id",id);if(error)return alert(error.message);await sb.from("notifications").update({read_at:new Date().toISOString()}).eq("comment_id",id).eq("user_id",myId);await refreshNotifications();await loadPageExtras(pageId)}
async function uploadFiles(pageId){let list=[];if(wordUpload.files[0])list.push([wordUpload.files[0],'word']);for(let f of photoUpload.files)list.push([f,'photo']);if(!list.length)return alert('Choisis au moins un fichier.');for(let [f,kind] of list){let path=`${pageId}/${Date.now()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let up=await sb.storage.from('page-files').upload(path,f);if(up.error){alert('Envoi impossible : '+up.error.message);continue}let ins=await sb.from('page_files').insert({page_id:pageId,uploaded_by:appMe.display_name||appMe.username,kind,file_name:f.name,storage_path:path}).select('id,page_id,kind,file_name,storage_path,uploaded_by,created_at').single();if(ins.error){await sb.storage.from('page-files').remove([path]);alert('Le fichier a été envoyé mais son enregistrement a été refusé : '+ins.error.message);continue}}await loadPageExtras(pageId);await loadIssue();renderRail()}
async function downloadFile(path,name){let r=await sb.storage.from('page-files').download(path);if(r.error)return alert('Téléchargement impossible : '+r.error.message);let url=URL.createObjectURL(r.data),a=document.createElement('a');a.href=url;a.download=name||'fichier';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function deleteFile(id,path,pageId){if(!confirm('Supprimer définitivement ce fichier ?'))return;let st=await sb.storage.from('page-files').remove([path]);if(st.error)return alert('Suppression impossible : '+st.error.message);let db=await sb.from('page_files').delete().eq('id',id);if(db.error)return alert('Le fichier a été supprimé du stockage mais pas de la liste : '+db.error.message);await loadPageExtras(pageId);await loadIssue();renderRail()}
async function postComment(pageId){let body=newComment.value.trim();if(!body)return;let myId=localStorage.getItem("so_user_id");let {data:c,error}=await sb.from('page_comments').insert({page_id:pageId,author_id:myId,body}).select().single();if(error)return alert(error.message);let names=[...body.matchAll(/@([A-Za-z0-9._-]+)/g)].map(m=>m[1].toLowerCase());for(let name of new Set(names)){let u=users.find(x=>x.username.toLowerCase()===name);if(u&&u.id!==myId){let {error:nerr}=await sb.from('notifications').insert({user_id:u.id,actor_id:myId,page_id:pageId,comment_id:c.id,message:body});if(nerr)alert("Notification non envoyée : "+nerr.message)}}await loadPageExtras(pageId);await loadIssue();renderRail();modal.classList.remove("on")}

init();
</script>
</body></html>
